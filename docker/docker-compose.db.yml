services:
  postgres:
    image: postgres:15-alpine
    container_name: tv-dlog-bd
    restart: always
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_backup.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - tvdlog-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  tvdlog-network:
    name: tvdlog-network

volumes:
  postgres_data:
