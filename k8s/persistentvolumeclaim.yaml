apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvdlog-uploads-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: tvdlog
    app.kubernetes.io/component: storage-uploads
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tvdlog-postgres-pvc
  namespace: default
  labels:
    app.kubernetes.io/name: tvdlog
    app.kubernetes.io/component: storage-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
