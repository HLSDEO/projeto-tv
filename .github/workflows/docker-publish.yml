name: Publish Docker Images to GHCR

on:
  push:
    branches: [main, master]

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Owner
        id: repo_owner
        run: |
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER_LC }}/projeto-tv-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER_LC }}/projeto-tv-backend:${{ github.sha }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            BUILD_DATE=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.OWNER_LC }}/projeto-tv-frontend:latest
            ghcr.io/${{ steps.repo_owner.outputs.OWNER_LC }}/projeto-tv-frontend:${{ github.sha }}
