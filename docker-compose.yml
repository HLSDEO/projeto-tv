services:
  backend:
    restart: always
    build:
      context: ./backend
    ports:
      - "8300:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@tv-dlog-bd:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - UPLOAD_DIR=${UPLOAD_DIR}
      - PYTHONPATH=/app/app
      - APEX_REST_URL=${APEX_REST_URL}
      - LOG_DIR=${LOG_DIR}
      - LOG_FILE=${LOG_FILE}
      - LOG_LEVEL=${LOG_LEVEL}
      - AMBIENTE=${AMBIENTE}
      - DEV_BASE_URL_APEX=${DEV_BASE_URL_APEX}
      - PROD_BASE_URL_APEX=${PROD_BASE_URL_APEX}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "appsdev.pf.gov.br:10.2.137.17"
      - "sistemas.dpf.gov.br:10.2.112.46"
      - "appslite.pf.gov.br:10.2.134.12"
    networks:
      - tvdlog-network
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads # Bind-mount to keep upload files synchronized locally in the project

  frontend:
    restart: always
    build:
      context: ./frontend
    ports:
      - "3100:3100"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - DOCKER_ENV=true
      - BACKEND_HOST=backend:8000
    networks:
      - tvdlog-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

networks:
  tvdlog-network:
    external: true

