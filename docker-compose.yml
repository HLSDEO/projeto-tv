services:
  postgres:
    image: postgres:15-alpine
    restart: always
    command: ["postgres", "-p", "5442"]
    environment:
      POSTGRES_USER: tvdlog
      POSTGRES_PASSWORD: tvdlog123
      POSTGRES_DB: tv_dlog_db
      TZ: America/Sao_Paulo
    ports:
      - "5442:5442"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvdlog -d tv_dlog_db -p 5442"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    restart: always
    build:
      context: ./backend
    ports:
      - "8100:8100"
    environment:
      - DATABASE_URL=postgresql://tvdlog:tvdlog123@postgres:5442/tv_dlog_db
      - SECRET_KEY=minha_chave_secreta_jwt_super_segura
      - TZ=America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads

  frontend:
    restart: always
    build:
      context: ./frontend
    ports:
      - "3100:3100"
    environment:
      - VITE_API_URL=/
      - TZ=America/Sao_Paulo
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  upload_data:
